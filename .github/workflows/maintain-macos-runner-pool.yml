name: Maintain macOS runner pool

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  # Only execute the pinned controller, never the triggering run's code or artifacts.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [Managed macOS runner]
    branches: [feature/ephemeral-runner-pool]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: managed-macos-runners
  cancel-in-progress: false

jobs:
  maintain:
    if: >-
      github.repository == 'setup-php/homebrew-extensions' &&
      (github.event_name != 'workflow_run' ||
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: nscloud-ubuntu-24.04-amd64-2x4
    timeout-minutes: 10
    environment: runner-pool-controller
    steps:
      - name: Check out pinned runner controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9e9cfd70774aa3fee951845d653953a130873dae
          persist-credentials: false
      - name: Maintain twelve reusable Namespace ARM64 macOS runners
        env:
          GH_TOKEN: ${{ secrets.RUNNER_POOL_ADMIN_TOKEN }}
          POOL_SIZE: ${{ vars.HOMEBREW_MACOS15_RUNNERS || '3' }}
          MACOS26_POOL_SIZE: ${{ vars.HOMEBREW_MACOS26_RUNNERS || '5' }}
          XCODE27_POOL_SIZE: ${{ vars.HOMEBREW_XCODE27_RUNNERS || '4' }}
          HOST_CAPACITY: '12'
        run: python3 scripts/managed_pool.py
